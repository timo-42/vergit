name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Release level to create
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      phase:
        description: Release phase to create
        required: true
        default: final
        type: choice
        options:
          - final
          - alpha
          - beta
          - rc

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.version.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      create-tag: ${{ steps.version.outputs.create-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: version
        name: Determine release version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          BUMP: ${{ inputs.bump }}
          PHASE: ${{ inputs.phase }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            args=("--next-$BUMP" --with-prefix)
            if [ "$PHASE" != final ]; then
              args+=("--next-$PHASE")
            fi
            tag="$(cargo run --release --quiet --locked -- pep440 "${args[@]}")"
            create_tag=true
          else
            tag="$REF_NAME"
            create_tag=false
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "create-tag=$create_tag" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install musl tools
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          suffix=""
          case "${{ matrix.target }}" in *windows*) suffix=".exe" ;; esac
          src="target/${{ matrix.target }}/release/vergit${suffix}"
          cp "$src" "vergit-${{ matrix.target }}${suffix}"
          ls -l "vergit-${{ matrix.target }}${suffix}"

      - uses: actions/upload-artifact@v6
        with:
          name: vergit-${{ matrix.target }}
          path: vergit-${{ matrix.target }}*
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        if: needs.prepare.outputs.create-tag == 'true'
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Create version tag
        if: needs.prepare.outputs.create-tag == 'true'
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$TAG" "$SHA" --message "Release $TAG"
          git push origin "$TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release create "$TAG" dist/vergit-* --generate-notes --repo "$GITHUB_REPOSITORY"
